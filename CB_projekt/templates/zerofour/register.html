{% extends "zerofour/base.html" %}

{% block content %}
<section class="container box" style="max-width: 500px; margin: 0 auto; padding: 3em;">
    <header class="major" style="text-align: center;">
        <h2>Rejestracja</h2>
        <p>Załóż konto, aby rozwiązywać zadania CTF</p>
    </header>

    <!-- KOMUNIKATY BŁĘDÓW -->
    {% if error %}
    <div style="background: rgba(255,0,0,0.15); border: 1px solid #ff4444; border-radius: 8px; padding: 12px; margin-bottom: 20px; text-align: center;">
        <p style="color: #ff6666; margin: 0;">{{ error }}</p>
    </div>
    {% endif %}

    {% if success %}
    <div style="background: rgba(0,255,136,0.1); border: 1px solid #00ff88; border-radius: 8px; padding: 12px; margin-bottom: 20px; text-align: center;">
        <p style="color: #00ff88; margin: 0;">{{ success }}</p>
    </div>
    {% endif %}

    <form method="POST" action="/register" id="registerForm">
        <div class="row gtr-50">
            <div class="col-12">
                <input type="text" name="username" id="username" placeholder="Nazwa użytkownika" required />
            </div>
            <div class="col-12">
                <input type="password" name="password" id="password" placeholder="Hasło" required />
            </div>
            <div class="col-12">
                <input type="password" name="confirm_password" id="confirm_password" placeholder="Potwierdź hasło" required />
            </div>
            <div class="col-12" style="text-align: center; margin-top: 1.5em;">
                <ul class="actions" style="display: inline-flex; justify-content: center; width: 100%;">
                    <li><input type="submit" class="button large" value="Zarejestruj się" /></li>
                </ul>
            </div>
        </div>
    </form>

    <div style="text-align: center; margin-top: 1.5em;">
        <p style="color: #aaa; font-size: 0.9em;">
            Masz już konto? <a href="/login" style="color: #50a1cf;">Zaloguj się</a>
        </p>
    </div>
</section>

<script>
    // Walidacja po stronie klienta (zapobiega wysłaniu gdy hasła się różnią)
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        var password = document.getElementById('password').value;
        var confirm = document.getElementById('confirm_password').value;
        if (password !== confirm) {
            e.preventDefault();
            alert('Hasła muszą być identyczne!');
        }
    });
</script>
{% endblock %}
