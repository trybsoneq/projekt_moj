name: Python tests

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
      - "feature/**"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CB_projekt
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: CB_projekt/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "httpx>=0.27,<1"

      - name: Compile Python modules
        run: python -m compileall -q .

      - name: Run unit tests
        run: python -m unittest -v test_auth.py test_docker_manager.py test_activity.py test_hints.py test_migrate_hints.py test_achievements.py test_tournaments.py test_templates.py
